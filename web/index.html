<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketing by WhatsApp — Satu Restoe</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header><div class="wrap"><div><h1>MARKETING BY WHATSAPP — SATU RESTOE</h1><p>Kirim WhatsApp ke customer • Tandai sudah dihubungi • Data tersimpan di cloud</p></div></div></header>
<main class="wrap">
<section class="card">
<div class="stats">
<div><span>Total</span><b id="total">0</b></div>
<div><span>Belum Dihubungi</span><b id="new">0</b></div>
<div><span>Sudah Dihubungi</span><b id="contacted">0</b></div>
</div>
</section>
<section class="card">
<div class="toolbar"><div class="cats" id="cats"></div></div>
<div class="searchRow"><input id="search" placeholder="Cari nama, kota, WhatsApp..." autocomplete="off"><button id="clearSearch" class="gray" type="button">Clear</button></div>
<div class="filters"><select id="statusFilter"><option value="">Semua Status</option><option value="Belum dihubungi">Belum Dihubungi</option><option value="Sudah dihubungi">Sudah Dihubungi</option></select></div>
<div class="bulkBar"><label><input id="selectAll" type="checkbox"> Pilih semua yang tampil</label><span id="selectedCount">0 dipilih</span><button id="waSelectedBtn" class="green" type="button">WA Berikutnya</button></div>
<div class="table"><table><thead><tr><th>✓</th><th>No</th><th>P</th><th>Nama</th><th>Kota</th><th>WA</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table></div>
</section>
<section class="grid">
<section class="card editorCard"><h2 id="title">Pilih Customer</h2><div id="detail" class="muted detailBox">Pilih customer dari daftar.</div></section>
<section class="card editorCard" id="editor">
<label>Status</label>
<select id="status"><option>Belum dihubungi</option><option>Sudah dihubungi</option></select>
<div class="row editorActions">
<button class="green primaryAction" id="waBtn">💬 WA Customer</button>
<button class="blue secondaryAction" id="saveBtn">Simpan Status</button>
</div>
<pre id="messagePreview" class="messagePreview hidden"></pre>
</section>
</section>
<section class="card"><span id="appMsg" class="muted"></span></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body></html>
