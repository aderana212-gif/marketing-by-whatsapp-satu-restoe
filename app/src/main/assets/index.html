<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketing By WhatsApp — Satu Restoe</title><style>body{margin:0;background:#eef3f8;color:#172033;font-family:Arial,sans-serif}header{background:#0b3a75;color:#fff;padding:18px}h1{margin:0;font-size:22px}main{max-width:1100px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 10px #0001}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f2f6fa;padding:12px;border-radius:10px}.stat b{display:block;font-size:22px}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 9px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}textarea{min-height:220px;line-height:1.45}button{padding:11px 14px;border:0;border-radius:8px;font-weight:bold;margin:3px;cursor:pointer}.blue{background:#0b3a75;color:#fff}.green{background:#25d366;color:#fff}.gray{background:#e7edf4}.red{background:#c62828;color:#fff}.notice{background:#edf7ee;border-left:4px solid #28a745;padding:9px;border-radius:7px}.table{overflow:auto;max-height:520px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#f4f6f8}.selected{background:#eaf3ff}</style></head><body><header><h1>MARKETING BY WHATSAPP — SATU RESTOE</h1><div>Database Travel • Pesan Marketing • WhatsApp Business</div></header><main><div class="card"><div class="stats"><div class="stat">Total<b id="totalCount">0</b></div><div class="stat">Belum Dihubungi<b id="newCount">0</b></div><div class="stat">Follow Up<b id="followCount">0</b></div><div class="stat">Respon/Deal<b id="respCount">0</b></div></div></div><div class="grid"><section class="card"><h2>Database Customer</h2><div class="notice"><b id="noticeCount">166</b> calon customer sudah tertanam. Bisa ditambah kapan saja.</div><button class="blue" onclick="newCustomer()">＋ Tambah Customer</button><button class="gray" onclick="exportCSV()">Export CSV</button><input id="searchBox" placeholder="Cari travel, kota, WA..." oninput="render()"><select id="provFilter" onchange="render()"><option value="">Semua Provinsi</option><option>Jawa Barat</option><option>Jawa Tengah</option></select><select id="prioFilter" onchange="render()"><option value="">Semua Prioritas</option><option>A</option><option>B</option></select><select id="statusFilter" onchange="render()"><option value="">Semua Status</option><option>Belum dihubungi</option><option>Sudah dihubungi</option><option>Follow Up</option><option>Respon</option><option>Deal</option></select><div class="table"><table><thead><tr><th>No</th><th>P</th><th>Travel</th><th>Kota</th><th>WA</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table></div></section><section class="card"><h2 id="customerTitle">Pilih Customer</h2><label>Nama Travel</label><input id="nameBox"><label>Provinsi</label><input id="provBox"><label>Kota / Area</label><input id="cityBox"><label>WhatsApp</label><input id="phoneBox" placeholder="08xxxxxxxxxx"><label>Prioritas</label><select id="prioBox"><option>A</option><option>B</option></select><label>Status</label><select id="statusBox"><option>Belum dihubungi</option><option>Sudah dihubungi</option><option>Follow Up</option><option>Respon</option><option>Deal</option></select><label>Pesan Marketing</label><textarea id="messageBox"></textarea><button class="blue" onclick="saveCustomer()">💾 Simpan</button><button class="gray" onclick="copyMessage()">📋 Copy Pesan</button><button class="green" onclick="openBusiness()">💬 WA Business</button><button class="gray" onclick="openChrome()">🌐 Chrome</button><button class="gray" onclick="copyWALink()">🔗 Copy Link</button><button class="red" onclick="deleteCustomer()">Hapus</button><label>Catatan</label><textarea id="notesBox" style="min-height:80px"></textarea></section></div></main><script src="data.js"></script><script>let data=loadData(),selected=-1;const msgTemplate="Assalamu'alaikum Bapak/Ibu [NAMA TRAVEL] 🙏\n\nPerkenalkan, kami dari *Satu Restoe Pangandaran*.\n\nKami ingin menawarkan kerja sama untuk kebutuhan *makan rombongan wisata* yang berkunjung ke Pangandaran. 🍽️🌴\n\nKami menyiapkan *menu khusus rombongan dengan harga yang bersahabat untuk travel*, sehingga perjalanan tamu lebih nyaman dan praktis.\n\nApabila Bapak/Ibu berkenan, kami siap kirimkan *brosur menu & harga* untuk dipertimbangkan sebagai salah satu pilihan tempat makan rombongan.\n\nApakah Bapak/Ibu saat ini memiliki rombongan atau itinerary ke Pangandaran?\n\nTerima kasih 🙏\n*SATU RESTOE PANGANDARAN*";function loadData(){try{let x=JSON.parse(localStorage.getItem('satuRestoeMarketing166'));if(Array.isArray(x)&&x.length)return x}catch(e){}return DATA.map(x=>({...x}))}function persist(){try{localStorage.setItem('satuRestoeMarketing166',JSON.stringify(data))}catch(e){}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function personalize(x){return msgTemplate.replaceAll('[NAMA TRAVEL]',x?.name||'').replaceAll('[KOTA]',x?.city||'')}function pick(i){selected=i;let x=data[i];nameBox.value=x.name;provBox.value=x.prov;cityBox.value=x.city;phoneBox.value=x.phone;prioBox.value=x.prio;statusBox.value=x.status;notesBox.value=x.notes||'';messageBox.value=personalize(x);customerTitle.textContent='Customer #'+(i+1);render()}function newCustomer(){selected=-1;customerTitle.textContent='Customer Baru';nameBox.value='';provBox.value='';cityBox.value='';phoneBox.value='';prioBox.value='A';statusBox.value='Belum dihubungi';notesBox.value='';messageBox.value=msgTemplate}function saveCustomer(){let x={name:nameBox.value.trim(),prov:provBox.value.trim(),city:cityBox.value.trim(),phone:phoneBox.value.trim(),prio:prioBox.value,status:statusBox.value,notes:notesBox.value.trim()};if(!x.name)return alert('Nama travel wajib diisi.');if(selected<0){data.push(x);selected=data.length-1}else data[selected]=x;persist();render();pick(selected);alert('Tersimpan.')}function deleteCustomer(){if(selected<0)return alert('Pilih customer.');if(confirm('Hapus customer ini?')){data.splice(selected,1);persist();selected=-1;render();newCustomer()}}async function copyMessage(){try{await navigator.clipboard.writeText(messageBox.value);alert('Pesan berhasil dicopy.')}catch(e){messageBox.select();document.execCommand('copy');alert('Silakan paste di WhatsApp.')}}function waLink(){let p=phoneBox.value.replace(/\D/g,'');if(p.startsWith('0'))p='62'+p.slice(1);return p?'https://wa.me/'+p+'?text='+encodeURIComponent(messageBox.value):''}function openBusiness(){let p=phoneBox.value.trim();if(!p)return alert('Nomor WhatsApp belum diisi.');if(window.Android&&Android.openWhatsAppBusiness){Android.openWhatsAppBusiness(p,messageBox.value);markContacted()}else alert('Tombol ini aktif pada APK Android. Gunakan Chrome pada versi web.')}function markContacted(){if(selected>=0){data[selected].status='Sudah dihubungi';statusBox.value='Sudah dihubungi';persist();render()}}function openChrome(){let u=waLink();if(!u)return alert('Nomor WhatsApp belum diisi.');window.open(u,'_blank');markContacted()}async function copyWALink(){let u=waLink();if(!u)return alert('Nomor WhatsApp belum diisi.');try{await navigator.clipboard.writeText(u);alert('Link WhatsApp berhasil dicopy. Silakan paste di Chrome.')}catch(e){let t=document.createElement('textarea');t.value=u;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('Link WhatsApp berhasil dicopy.')}}function render(){let q=searchBox.value.toLowerCase(),pf=provFilter.value,pr=prioFilter.value,sf=statusFilter.value;tbody.innerHTML='';data.forEach((x,i)=>{let ok=(!q||[x.name,x.city,x.phone,x.prov].join(' ').toLowerCase().includes(q))&&(!pf||x.prov===pf)&&(!pr||x.prio===pr)&&(!sf||x.status===sf);if(ok){let r=document.createElement('tr');if(i===selected)r.className='selected';r.onclick=()=>pick(i);r.innerHTML='<td>'+(i+1)+'</td><td>'+esc(x.prio)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.city)+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.status)+'</td>';tbody.appendChild(r)}});totalCount.textContent=data.length;newCount.textContent=data.filter(x=>x.status==='Belum dihubungi').length;followCount.textContent=data.filter(x=>x.status==='Follow Up').length;respCount.textContent=data.filter(x=>x.status==='Respon'||x.status==='Deal').length;noticeCount.textContent=data.length}function exportCSV(){let h='No,Prioritas,Provinsi,Kota / Area,Nama Travel,WhatsApp,Status,Catatan\n';let b=data.map((x,i)=>[i+1,x.prio,x.prov,x.city,x.name,x.phone,x.status,x.notes||''].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h+b],{type:'text/csv;charset=utf-8'}));a.download='Satu_Restoe_Customer.csv';a.click()}messageBox.value=msgTemplate;render();</script></body></html>
