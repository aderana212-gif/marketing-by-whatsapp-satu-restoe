<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketing Satu Restoe</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;font-family:Arial;color:#172033}header{background:#0b3a75;color:#fff;padding:22px 14px}.wrap{max-width:1200px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 9px #0001}.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.cat{padding:12px 7px;border:2px solid #dbe3ec;border-radius:12px;background:#fff;font-weight:bold}.cat.active{border-color:#0b3a75;background:#eaf3ff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f2f6fa;padding:10px;border-radius:9px}.stat b{display:block;font-size:20px}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.cats{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd4df;border-radius:8px;margin:4px 0 8px;font-size:14px}textarea{min-height:180px}button{padding:10px 12px;border:0;border-radius:8px;font-weight:bold;margin:3px;cursor:pointer}.blue{background:#0b3a75;color:#fff}.green{background:#25d366;color:#fff}.gray{background:#e7edf4}.red{background:#c62828;color:#fff}.notice{background:#edf7ee;padding:9px;border-left:4px solid #28a745;border-radius:7px;font-size:12px}.table{overflow:auto;max-height:560px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}th{background:#f3f5f8;position:sticky;top:0}tr.selected,tr:hover{background:#eaf3ff}.history{background:#f6f8fb;border-radius:10px;padding:10px;margin-top:8px;font-size:12px}.hist{padding:6px 0;border-bottom:1px solid #e1e6ed}.row{display:flex;gap:6px;flex-wrap:wrap}.row button{flex:1;min-width:110px}.muted{color:#667085}</style></head><body><header><div class="wrap"><h1>MARKETING BY WHATSAPP — SATU RESTOE</h1><div>5 Database • Template WA berbeda • Follow-up • Offline</div></div></header><main class="wrap"><section class="card"><h3>Pilih Database</h3><div class="cats" id="cats"></div></section><section class="card"><div class="stats"><div class="stat">Total<b id="total">0</b></div><div class="stat">Belum Dihubungi<b id="new">0</b></div><div class="stat">Follow Up<b id="follow">0</b></div><div class="stat">Respon/Deal<b id="resp">0</b></div></div></section><div class="grid"><section class="card"><h3 id="dbTitle">Tour & Travel</h3><div class="notice" id="notice"></div><div class="row"><button class="blue" onclick="newCustomer()">＋ Tambah Customer</button><button class="gray" onclick="exportCSV()">Export CSV</button></div><input id="search" placeholder="Cari nama, kota, WA..." oninput="render()"><select id="provFilter" onchange="render()"><option value="">Semua Provinsi</option><option>Jawa Barat</option><option>Jawa Tengah</option><option>Lainnya</option></select><select id="prioFilter" onchange="render()"><option value="">Semua Prioritas</option><option>A</option><option>B</option></select><select id="statusFilter" onchange="render()"><option value="">Semua Status</option><option>Belum dihubungi</option><option>Sudah dihubungi</option><option>Follow Up</option><option>Respon</option><option>Deal</option></select><div class="table"><table><thead><tr><th>No</th><th>P</th><th>Nama</th><th>Kota</th><th>WA</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table></div></section><section class="card"><h3 id="title">Pilih Customer</h3><label>Nama</label><input id="name"><label>Kategori</label><select id="category"></select><label>Provinsi</label><input id="prov"><label>Kota / Area</label><input id="city"><label>WhatsApp</label><input id="phone"><label>Prioritas</label><select id="prio"><option>A</option><option>B</option></select><label>Status</label><select id="status"><option>Belum dihubungi</option><option>Sudah dihubungi</option><option>Follow Up</option><option>Respon</option><option>Deal</option></select><label>Marketing</label><input id="marketing"><label>Terakhir Dihubungi</label><input id="lastContact" type="datetime-local"><label>Jadwal Follow Up</label><input id="nextFollow" type="datetime-local"><label>Pesan WhatsApp</label><textarea id="message"></textarea><div class="row"><button class="blue" onclick="save()">💾 Simpan</button><button class="gray" onclick="copyMsg()">📋 Copy</button><button class="green" onclick="openWA()">💚 WA Business</button></div><div class="row"><button class="blue" onclick="mark('Sudah dihubungi')">✅ Dihubungi</button><button class="blue" onclick="mark('Follow Up')">📅 Follow Up</button><button class="gray" onclick="mark('Respon')">💬 Respon</button><button class="gray" onclick="mark('Deal')">🤝 Deal</button><button class="red" onclick="del()">Hapus</button></div><label>Catatan</label><textarea id="notes" style="min-height:80px"></textarea><div class="history"><b>Riwayat Kontak</b><div id="history" class="muted">Belum ada riwayat.</div></div></section></div></main><script src="data.js"></script><script src="category_data.js"></script><script>
const CATS={travel:{label:'🧳 TOUR & TRAVEL',short:'Tour & Travel'},bus:{label:'🚌 PO BUS / PARIWISATA',short:'PO Bus / Pariwisata'},eo:{label:'🎪 EO / MICE / OUTBOUND',short:'EO / MICE / Outbound'},corp:{label:'🏢 CORPORATE / INSTANSI',short:'Corporate / Instansi'},wedding:{label:'💍 WEDDING / WO',short:'Wedding / WO'}};
const T={travel:`Assalamu’alaikum Bapak/Ibu [NAMA] 🙏\n\nPerkenalkan, kami dari SATU RESTOE Pangandaran.\n\nKami membuka kerja sama *Travel Partner* untuk kebutuhan makan rombongan yang berkunjung ke Pangandaran. 🍽️🌴\n\nKami memiliki kapasitas hingga 500–600 pax, menu rombongan, outdoor, Dome dan fasilitas event. Paket dapat disesuaikan jumlah peserta dan budget.\n\nSatu Restoe dapat menjadi *pilihan tambahan/backup* untuk rombongan Bapak/Ibu.\n\nBoleh kami kirimkan menu & paket Travel Partner?\n\nTerima kasih 🙏\nSATU RESTOE PANGANDARAN\nWA 0812-2011-1178`,bus:`Assalamu’alaikum Bapak/Ibu [NAMA] 🙏\n\nPerkenalkan, kami SATU RESTOE Pangandaran.\n\nKami menyediakan tempat makan untuk *rombongan bus/pariwisata* dengan kapasitas hingga 500–600 pax. 🚌🍽️\n\nKami dapat membantu koordinasi kedatangan rombongan, pilihan menu dan kebutuhan makan dalam jumlah besar.\n\nApabila Bapak/Ibu memiliki trayek menuju Pangandaran, kami siap menjadi salah satu pilihan tempat makan rombongan.\n\nBoleh kami kirimkan menu & paket bus?\n\nTerima kasih 🙏\nSATU RESTOE PANGANDARAN\nWA 0812-2011-1178`,eo:`Assalamu’alaikum Bapak/Ibu [NAMA] 🙏\n\nPerkenalkan, kami dari SATU RESTOE Pangandaran.\n\nKami menyediakan *venue untuk EO / MICE / Gathering / Outbound* dalam satu lokasi. 🎪🌴\n\nTersedia indoor & outdoor, Dome ±100 pax, kapasitas hingga 500–600 pax, sound system, projector, big screen, live music, karaoke dan fasilitas pendukung lainnya.\n\nKami siap bekerja sama sebagai venue partner untuk event Bapak/Ibu.\n\nDokumentasi wedding/event kami: TikTok @saturestoe_\n\nBoleh kami kirimkan paket venue & event?\n\nTerima kasih 🙏\nSATU RESTOE PANGANDARAN\nWA 0812-2011-1178`,corp:`Assalamu’alaikum Bapak/Ibu [NAMA] 🙏\n\nPerkenalkan, kami dari SATU RESTOE Pangandaran.\n\nKami menyediakan tempat untuk *meeting, rapat, seminar, gathering dan acara perusahaan/instansi*. 🏢🍽️\n\nTersedia indoor & outdoor, Dome ±100 pax, kapasitas hingga 500–600 pax, sound system, projector, big screen, live music serta paket makan yang dapat disesuaikan.\n\nJika Bapak/Ibu memiliki agenda di Pangandaran, kami siap membantu menyiapkan konsep dan paketnya.\n\nBoleh kami kirimkan paket Corporate / Instansi?\n\nTerima kasih 🙏\nSATU RESTOE PANGANDARAN\nWA 0812-2011-1178`,wedding:`Assalamu’alaikum Bapak/Ibu [NAMA] 🙏\n\nPerkenalkan, kami dari SATU RESTOE Pangandaran.\n\nKami menyediakan *Wedding & Reception Venue* untuk acara pernikahan, baik intimate maupun acara besar. 💍🌴\n\nTersedia indoor & outdoor, Dome ±100 pax, kapasitas hingga 500–600 pax, catering, sound system, projector, big screen, live music dan fasilitas pendukung event.\n\nKami terbuka bekerja sama dengan Wedding Organizer, dekorasi, MUA, foto/video dan vendor lainnya.\n\nDokumentasi wedding/event kami: TikTok @saturestoe_\n\nBoleh kami kirimkan paket Wedding Venue Satu Restoe?\n\nTerima kasih 🙏\nSATU RESTOE PANGANDARAN\nWA 0812-2011-1178`};
const KEY='satu_restoe_marketing_v4';let current='travel',selected=-1,data=[];
const norm=p=>String(p||'').replace(/\D/g,'').replace(/^0/,'62');
function seed(){const seen=new Set();const out=[];function add(x){const p=norm(x.phone);if(!p||seen.has(p))return;seen.add(p);out.push(x)};if(Array.isArray(SEED))SEED.forEach(x=>add({prio:x[0],prov:x[1],city:x[2],name:x[3],phone:x[4],category:'travel',status:'Belum dihubungi',notes:'',marketing:'',lastContact:'',nextFollow:'',history:[]}));if(typeof CATEGORY_DATA==='object')Object.keys(CATEGORY_DATA).forEach(k=>CATEGORY_DATA[k].forEach(x=>add({prio:x[3]||'B',prov:/Tegal|Wonosobo|Banyumas|Purwokerto|Cilacap|Kebumen|Magelang|Pekalongan|Pemalang/.test(x[1])?'Jawa Tengah':'Jawa Barat',city:x[1],name:x[0],phone:x[2],category:k,status:'Belum dihubungi',notes:'',marketing:'',lastContact:'',nextFollow:'',history:[]})));return out}
try{const s=JSON.parse(localStorage.getItem(KEY));data=Array.isArray(s)?s:seed()}catch(e){data=seed()}function $(id){return document.getElementById(id)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function msg(x){return T[x?.category||current].replaceAll('[NAMA]',x?.name||'Bapak/Ibu')}function fillCat(){let h='';Object.keys(CATS).forEach(k=>h+=`<option value="${k}">${CATS[k].short}</option>`);$('category').innerHTML=h}function renderCats(){let h='';Object.keys(CATS).forEach(k=>h+=`<button class="cat ${k===current?'active':''}" onclick="selectCat('${k}')">${CATS[k].label}<br><small>${data.filter(x=>x.category===k).length} customer</small></button>`);$('cats').innerHTML=h}function selectCat(k){current=k;selected=-1;$('dbTitle').textContent=CATS[k].short;$('search').value='';renderCats();render();newCustomer()}function render(){const q=$('search').value.toLowerCase(),pf=$('provFilter').value,pr=$('prioFilter').value,sf=$('statusFilter').value,arr=data.filter(x=>x.category===current);let h='';arr.forEach((x,n)=>{const ok=(!q||[x.name,x.city,x.phone,x.prov].join(' ').toLowerCase().includes(q))&&(!pf||x.prov===pf)&&(!pr||x.prio===pr)&&(!sf||x.status===sf);if(ok)h+=`<tr class="${data.indexOf(x)===selected?'selected':''}" onclick="pick(${data.indexOf(x)})"><td>${n+1}</td><td>${esc(x.prio)}</td><td>${esc(x.name)}</td><td>${esc(x.city)}</td><td>${esc(x.phone)}</td><td>${esc(x.status)}</td></tr>`});$('tbody').innerHTML=h;$('total').textContent=arr.length;$('new').textContent=arr.filter(x=>x.status==='Belum dihubungi').length;$('follow').textContent=arr.filter(x=>x.status==='Follow Up').length;$('resp').textContent=arr.filter(x=>x.status==='Respon'||x.status==='Deal').length;$('notice').innerHTML='<b>'+arr.length+' customer</b> dalam database '+CATS[current].short+'. Nomor duplikat otomatis dihitung satu kali.'}function pick(i){selected=i;const x=data[i];current=x.category||'travel';renderCats();$('title').textContent='Customer #'+(i+1);$('name').value=x.name||'';$('category').value=current;$('prov').value=x.prov||'';$('city').value=x.city||'';$('phone').value=x.phone||'';$('prio').value=x.prio||'A';$('status').value=x.status||'Belum dihubungi';$('marketing').value=x.marketing||'';$('lastContact').value=x.lastContact||'';$('nextFollow').value=x.nextFollow||'';$('notes').value=x.notes||'';$('message').value=msg(x);historyView(x);render()}function newCustomer(){$('title').textContent='Customer Baru';selected=-1;$('category').value=current;['name','prov','city','phone','marketing','lastContact','nextFollow','notes'].forEach(i=>$(i).value='');$('prio').value='A';$('status').value='Belum dihubungi';$('message').value=T[current];$('history').textContent='Customer baru.'}function save(){const cat=$('category').value,p=$('phone').value.trim(),n=norm(p),dup=data.findIndex((x,i)=>i!==selected&&norm(x.phone)===n&&n);if(dup>=0)return alert('Nomor sudah ada: '+data[dup].name);const old=selected>=0?data[selected]:null,x={name:$('name').value.trim(),prov:$('prov').value.trim(),city:$('city').value.trim(),phone:p,prio:$('prio').value,status:$('status').value,category:cat,marketing:$('marketing').value.trim(),lastContact:$('lastContact').value,nextFollow:$('nextFollow').value,notes:$('notes').value.trim(),history:old?.history||[]};if(!x.name||!x.phone)return alert('Nama dan WhatsApp wajib diisi');if(selected<0){x.history.push({date:new Date().toISOString(),action:'Customer dibuat',note:'Tambah manual'});data.push(x);selected=data.length-1}else data[selected]=x;persist();current=cat;renderCats();render();pick(selected);alert('Tersimpan.')}function mark(status){if(selected<0)return alert('Pilih customer dulu');const x=data[selected];x.status=status;x.lastContact=new Date().toISOString().slice(0,16);x.history=x.history||[];x.history.push({date:new Date().toISOString(),action:status,note:''});persist();pick(selected)}function historyView(x){const h=x?.history||[];$('history').innerHTML=h.length?h.slice().reverse().map(a=>`<div class="hist">${new Date(a.date).toLocaleString('id-ID')} — <b>${esc(a.action)}</b>${a.note?' — '+esc(a.note):''}</div>`).join(''):'Belum ada riwayat.'}function copyMsg(){navigator.clipboard?.writeText($('message').value).then(()=>alert('Pesan disalin.'))}function openWA(){const p=norm($('phone').value);if(!p)return alert('Nomor WhatsApp belum diisi');window.open('https://wa.me/'+p+'?text='+encodeURIComponent($('message').value),'_blank')}function del(){if(selected<0)return;if(confirm('Hapus customer ini?')){data.splice(selected,1);selected=-1;persist();renderCats();render();newCustomer()}}function exportCSV(){const arr=data.filter(x=>x.category===current),rows=[['Nama','Kategori','Provinsi','Kota','WhatsApp','Prioritas','Status','Marketing','Follow Up','Catatan']].concat(arr.map(x=>[x.name,CATS[x.category]?.short,x.prov,x.city,x.phone,x.prio,x.status,x.marketing,x.nextFollow,x.notes]));const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='SatuRestoe_'+current+'.csv';a.click()}fillCat();renderCats();render();newCustomer();
</script></body></html>
