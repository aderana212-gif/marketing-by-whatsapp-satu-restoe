plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saturestoe.marketing'
    compileSdk 35

    defaultConfig {
        applicationId 'com.saturestoe.marketing'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    def ks = System.getenv('SATU_RESTOE_KEYSTORE')
    def sp = System.getenv('SATU_RESTOE_STORE_PASSWORD')
    def ka = System.getenv('SATU_RESTOE_KEY_ALIAS')
    def kp = System.getenv('SATU_RESTOE_KEY_PASSWORD')
    def releaseSigningConfigured = ks && sp && ka && kp
    def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

    if (releaseRequested && !releaseSigningConfigured) {
        throw new GradleException('Release signing secrets are not configured')
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(ks)
                storePassword sp
                keyAlias ka
                keyPassword kp
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}
