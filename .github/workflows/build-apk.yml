name: Build Marketing By WhatsApp APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Verify release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.SATU_RESTOE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SATU_RESTOE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SATU_RESTOE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SATU_RESTOE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo 'Missing SATU_RESTOE_KEYSTORE_B64' && exit 1)
          test -n "$STORE_PASSWORD" || (echo 'Missing SATU_RESTOE_STORE_PASSWORD' && exit 1)
          test -n "$KEY_ALIAS" || (echo 'Missing SATU_RESTOE_KEY_ALIAS' && exit 1)
          test -n "$KEY_PASSWORD" || (echo 'Missing SATU_RESTOE_KEY_PASSWORD' && exit 1)

      - name: Restore permanent release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SATU_RESTOE_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/SatuRestoe-release.jks"
          test -s "$RUNNER_TEMP/SatuRestoe-release.jks"

      - name: Fix mobile responsive layout and embed database updater
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('*{box-sizing:border-box}', '*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}body{min-width:0}.wrap{width:100%;min-width:0}.card,.grid,.row,.table{min-width:0;max-width:100%}.table{width:100%}button,input,select,textarea{max-width:100%}')
          s = s.replace('.cats{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}', '.cats{grid-template-columns:repeat(3,1fr)}.cat{min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.stats{grid-template-columns:1fr 1fr}')
          if 'updater.js' not in s:
              s = s.replace('<script src="category_data.js"></script>', '<script src="category_data.js"></script><script src="updater.js"></script><script src="buttons.js"></script>')
          elif 'buttons.js' not in s:
              s = s.replace('<script src="updater.js"></script>', '<script src="updater.js"></script><script src="buttons.js"></script>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add verified prospect data batch 2
        run: cat app/src/main/assets/category_data_extra.js >> app/src/main/assets/category_data.js

      - name: Build signed release APK
        env:
          SATU_RESTOE_KEYSTORE: ${{ runner.temp }}/SatuRestoe-release.jks
          SATU_RESTOE_STORE_PASSWORD: ${{ secrets.SATU_RESTOE_STORE_PASSWORD }}
          SATU_RESTOE_KEY_ALIAS: ${{ secrets.SATU_RESTOE_KEY_ALIAS }}
          SATU_RESTOE_KEY_PASSWORD: ${{ secrets.SATU_RESTOE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify and rename APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/SatuRestoe_Marketing_WA_v1.3_RELEASE.apk
          ls -lh app/build/outputs/apk/release/SatuRestoe_Marketing_WA_v1.3_RELEASE.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SatuRestoe_Marketing_WA_v1.3_RELEASE
          path: app/build/outputs/apk/release/SatuRestoe_Marketing_WA_v1.3_RELEASE.apk
          if-no-files-found: error
          retention-days: 30

# v1.3: permanent release signing + live WhatsApp template updates.
